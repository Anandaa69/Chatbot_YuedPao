[project]
name = "chatbot-yuedpao"
version = "0.1.0"
description = "LINE Chatbot for Yuedpao with 4-Tier Router & Thai NLP"
authors = [
    {name = "Anandaa69",email = "anandasinlapachote0@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "playwright (>=1.62.0,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tqdm (>=4.70.0,<5.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

