[tool.poetry]
name = "chatbot-yuedpao"
version = "0.1.0"
description = "LINE Chatbot for Yuedpao with 4-Tier Router & Thai NLP Engine"
authors = ["Anandaa69 <anandasinlapachote0@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
flask = "^3.0.0"
line-bot-sdk = ">=3.0.0"
pythainlp = ">=5.0.0"
chromadb = ">=0.4.0"
sentence-transformers = ">=2.2.0"
rank-bm25 = ">=0.2.2"
editdistance = ">=0.8.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
playwright = "^1.40.0"
tqdm = "^4.66.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
